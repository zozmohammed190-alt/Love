<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة خاصة</title>
    <style>
        body {
            background-color: #fce4ec; /* لون الخلفية وردي هادئ */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        h1 {
            color: #d81b60; /* لون النص */
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .heart {
            color: #e91e63;
            font-size: 2rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    
    <h1>FATMA ♥</h1>
    <div class="heart">♥ كمان</div>

</body>
</html>
